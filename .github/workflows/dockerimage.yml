name: Docker Image CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - runner: ubuntu-latest
            platform: linux/arm/v7
            arch: arm-v7
          - runner: ubuntu-latest
            platform: linux/ppc64le
            arch: ppc64le
          - runner: ubuntu-latest
            platform: linux/s390x
            arch: s390x
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      # nginx builds natively on amd64/arm64; QEMU covers the other platforms
      # and the amd64 HTTP/3 client on the ARM64 runner.
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the Docker image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          tags: justdanz/nginx-http3-quictls:local
          cache-from: type=gha,scope=test-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.arch }}
      - name: Test nginx, modules, HTTP/2 and HTTP/3
        run: ./tests/smoke.sh
      - name: Save failed s390x image for diagnosis
        if: failure() && matrix.arch == 's390x' && steps.build.outcome == 'success'
        run: docker save justdanz/nginx-http3-quictls:local | gzip > /tmp/s390x-image.tar.gz
      - name: Upload failed s390x image
        if: failure() && matrix.arch == 's390x' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: s390x-image
          path: /tmp/s390x-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    needs: [lint, test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/ci-matrix.yml
    secrets: inherit
